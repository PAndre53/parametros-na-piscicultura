
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrar Mortalidade</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f7f5;
            margin: 0;
        }

        header {
            background: #176b4d;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background: #176b4d;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0f4d38;
        }

        .voltar {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #176b4d;
        }
    </style>
</head>

<body>

<header>
    <h1>Registrar Mortalidade</h1>
    <p>Registre a quantidade de peixes mortos</p>
</header>

<div class="container">

    <div class="card">

        <form method="POST">

            <label for="quantidade">
                Quantidade de peixes mortos
            </label>

            <input
                type="number"
                id="quantidade"
                name="quantidade"
                min="1"
                required
                placeholder="Ex.: 5"
            >


            <label for="observacao">
                Observação
            </label>

            <textarea
                id="observacao"
                name="observacao"
                placeholder="Descreva alguma informação relevante..."
            ></textarea>


            <button type="submit">
                Registrar mortalidade
            </button>

        </form>

        <a class="voltar" href="/">
            ← Voltar para o início
        </a>

    </div>

</div>

</body>
</html>
