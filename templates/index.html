<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Pessoas</title>
    <!-- Link para o arquivo CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Pessoas Cadastradas</h1>
        
        <!-- Botão usando a classe do CSS -->
        <a href="{{ url_for('cadastro') }}" class="btn">Novo Cadastro</a>
        
        <table>
            <tr>
                <th>Nome</th>
                <th>Sexo</th>
                <th>Data de Nascimento</th>
                <th>Cidade</th>
            </tr>
            {% for p in pessoas %}
            <tr>
                <td>{{ p.nome }}</td>
                <td>{{ p.sexo }}</td>
                <td>{{ p.data_nascimento }}</td>
                <td>{{ p.cidade }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
